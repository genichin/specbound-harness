name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and test
        run: python -m pip install -e ".[test]"
      - name: Test
        run: |
          set +e
          python -m pytest --junitxml=pytest-results.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              test_id = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = " ".join((problem.text or problem.get("message", "")).split())
              print(f"::error file=.github,title=pytest failure::{test_id}: {detail[:4000]}")
          PY
          fi
          exit "$status"
      - name: Preflight bootstrap harness
        run: specbound preflight
      - name: Validate bootstrap harness
        run: specbound validate
      - name: Verify generated requirement documentation
        run: specbound docs requirements --check
      - name: Build wheel
        run: python -m pip wheel --wheel-dir dist ".[test]"
      - name: Validate installed wheel
        run: |
          python -m venv /tmp/specbound-wheel
          /tmp/specbound-wheel/bin/pip install --no-index --find-links dist specbound
          /tmp/specbound-wheel/bin/specbound --root fixtures/valid-minimal validate
          /tmp/specbound-wheel/bin/specbound --root fixtures/valid-minimal agent validate-skills
          for role in discovery-author requirement-author micro-spec-author independent-reviewer implementation iteration-qc delivery-qc; do
            refs=""
            case "$role" in
              independent-reviewer) refs="--reference-result-file reference-results/independent-reviewer-producer_result_ref.json" ;;
              implementation) refs="--reference-result-file reference-results/implementation-reviewer_run_ref.json --reference-result-file reference-results/implementation-reviewer-producer_result_ref.json" ;;
              iteration-qc) refs="--reference-result-file reference-results/iteration-qc-producer_result_ref.json --reference-result-file reference-results/iteration-qc-reviewer_run_ref.json --reference-result-file reference-results/iteration-qc-reviewer-producer_result_ref.json" ;;
            esac
            /tmp/specbound-wheel/bin/specbound --root fixtures/agent-contract agent check-role-request --request-file "fixtures/agent-contract/positive/$role.request.json" $refs
            /tmp/specbound-wheel/bin/specbound --root fixtures/agent-contract agent validate-result --result-file "fixtures/agent-contract/positive/$role.result.json" $refs
            if /tmp/specbound-wheel/bin/specbound --root fixtures/agent-contract agent check-role-request --request-file "fixtures/agent-contract/negative/$role.request.json" $refs; then echo "negative $role request was accepted" >&2; exit 1; fi
            if /tmp/specbound-wheel/bin/specbound --root fixtures/agent-contract agent validate-result --result-file "fixtures/agent-contract/negative/$role.result.json" $refs; then echo "negative $role result was accepted" >&2; exit 1; fi
          done
          /tmp/specbound-wheel/bin/specbound --root . docs requirements --check
      - name: Harness validation
        run: python -m specbound.cli validate
