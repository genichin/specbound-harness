name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and test
        run: python -m pip install -e ".[test]"
      - name: Test
        run: |
          set +e
          python -m pytest --junitxml=pytest-results.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              test_id = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = " ".join((problem.text or problem.get("message", "")).split())
              print(f"::error file=.github,title=pytest failure::{test_id}: {detail[:4000]}")
          PY
          fi
          exit "$status"
      - name: Preflight bootstrap harness
        run: specbound preflight
      - name: Validate bootstrap harness
        run: specbound validate
      - name: Verify generated requirement documentation
        run: specbound docs requirements --check
      - name: Build wheel
        run: python -m pip wheel --wheel-dir dist ".[test]"
      - name: Validate installed wheel
        run: |
          WHEEL_ENV="$RUNNER_TEMP/specbound-wheel"
          WHEEL_PY="$WHEEL_ENV/bin/python"
          WHEEL_CLI="$WHEEL_ENV/bin/specbound"
          python -m venv "$WHEEL_ENV"
          "$WHEEL_ENV/bin/pip" install --no-index --find-links dist specbound pytest
          unset PYTHONPATH
          "$WHEEL_PY" -I - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          import hashlib
          import os
          import specbound.agent_contract as agent_contract
          import specbound.hermes_adapter as hermes_adapter

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (agent_contract, hermes_adapter):
              installed = Path(module.__file__).resolve()
              assert "site-packages" in installed.parts, installed
              assert not installed.is_relative_to(repository), installed
              print(f"installed-module={installed}")

          for name in (
              "agent-roles.schema.json",
              "agent-result.schema.json",
              "hermes-adapter-config.schema.json",
              "hermes-invocation.schema.json",
          ):
              repository_bytes = (repository / "schemas" / name).read_bytes()
              installed_bytes = files("specbound.schemas").joinpath(name).read_bytes()
              assert installed_bytes == repository_bytes, name
              print(f"schema-sha256[{name}]={hashlib.sha256(installed_bytes).hexdigest()}")
          PY
          "$WHEEL_CLI" --root "$GITHUB_WORKSPACE/fixtures/valid-minimal" validate
          "$WHEEL_CLI" --root "$GITHUB_WORKSPACE/fixtures/valid-minimal" agent validate-skills
          cd "$RUNNER_TEMP"
          "$WHEEL_PY" -I -m pytest -c /dev/null -q \
            "$GITHUB_WORKSPACE/tests/test_agent_integration.py" \
            "$GITHUB_WORKSPACE/tests/test_hermes_adapter.py"
          "$WHEEL_CLI" --root "$GITHUB_WORKSPACE" docs requirements --check
      - name: Harness validation
        run: python -m specbound.cli validate
