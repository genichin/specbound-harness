name: One-shot REQ-0005 draft issuance

on:
  push:
    branches:
      - requirement/req-0005-live-qc-cutover

permissions:
  contents: write

jobs:
  issue-draft:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source
        run: python -m pip install -e .
      - name: Verify confirmed parent
        run: |
          specbound preflight
          specbound validate
      - name: Issue canonical REQ draft
        run: specbound req draft dcy-0005-r1 req-0005-r1
      - name: Commit generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specbound/requirements/req-0005/req-0005-r1.md
          git commit -m "docs(req): issue req-0005 draft"
          git push
