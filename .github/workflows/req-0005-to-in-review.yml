name: One-shot REQ-0005 review resubmission

on:
  push:
    branches:
      - requirement/req-0005-live-qc-cutover

permissions:
  contents: write

jobs:
  submit-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate exact bounded handoff
        run: |
          test "$(git rev-parse HEAD^)" = "c5ce8e7dcb4d30a1faf9cc2b68038ca565eb417c"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/req-0005-to-in-review.yml"
          test ! -e .specbound/review-submissions/req-0005-r1.review-submission.json
          test "$(sha256sum .specbound/requirements/req-0005/req-0005-r1.md | cut -d' ' -f1)" = "f831c2bb51511a057f03653b7e23a70c4aaaeb91cf1e625798e3d65db15b7d54"
          python -m specbound.cli --root . req check-readiness req-0005-r1
          python -m specbound.cli --root . validate
      - name: Submit canonical review handoff
        run: |
          python -m specbound.cli --root . req to-in-review req-0005-r1
          python -m specbound.cli --root . validate
          python -m specbound.cli --root . docs requirements
          python -m specbound.cli --root . docs requirements --check
      - name: Commit transition artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specbound/requirements/req-0005/req-0005-r1.md .specbound/review-submissions/req-0005-r1.review-submission.json docs/requirements.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .specbound/requirements/req-0005/req-0005-r1.md .specbound/review-submissions/req-0005-r1.review-submission.json docs/requirements.md | sort)"
          git diff --cached --check
          git commit -m "docs(req): resubmit req-0005 for review"
          git push
