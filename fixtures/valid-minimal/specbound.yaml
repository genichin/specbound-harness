version: 1
canonical:
  requirements_root: .specbound/requirements
  discoveries_root: .specbound/discoveries
  control_root: .specbound
  approvals_root: .specbound/approvals
  rejections_root: .specbound/rejections
  review_submissions_root: .specbound/review-submissions
  review_decisions_root: .specbound/review-decisions
  reconsiderations_root: .specbound/reconsiderations
  micro_spec_reviews_root: .specbound/micro-spec-reviews
  discovery_confirmations_root: .specbound/confirmations
  micro_specs_root: .specbound/micro-specs
  iteration_qc_root: .specbound/iteration-qc
  delivery_qc_root: .specbound/delivery-qc
  requirement_pattern: "req-<id>/req-<id>-r<revision>.md"
  discovery_pattern: "dcy-<id>-r<revision>.md"
  micro_spec_pattern: "req-<id>/ms-<id>-<slice>.md"
  iteration_qc_pattern: "req-<id>/iqc-<id>-<slice>-r<revision>.json"
  delivery_qc_pattern: "dqc-<id>-r<revision>.json"
policy:
  agent_contract:
    enabled: true
    roles_path: .specbound/policies/agent-roles.yaml
  approved_status: approved
  confirmed_discovery_status: confirmed
  discovery_confirmation_revision_policy: latest_only_with_explicit_exception
  requirement_revision_policy: latest_only_with_explicit_exception
  required_approval_fields:
    - requirement_path
    - requirement_id
    - revision
    - sha256
    - risk
    - authority
  required_rejection_fields:
    - schema_version
    - requirement_path
    - requirement_id
    - revision
    - reviewed_sha256
    - sha256
    - risk
    - authority
    - rejected_at
    - decision
    - reason
  required_review_submission_fields:
    - schema_version
    - requirement_path
    - requirement_id
    - revision
    - draft_sha256
    - reviewed_sha256
    - risk
    - owner
    - submitted_at
    - decision
    - permitted_next_action
  required_review_decision_fields:
    - schema_version
    - requirement_path
    - requirement_id
    - revision
    - reviewed_sha256
    - risk
    - authority
    - decided_at
    - decision
    - reason
  required_reconsideration_fields:
    - schema_version
    - requirement_path
    - requirement_id
    - revision
    - reviewed_sha256
    - rejected_sha256
    - reopened_sha256
    - risk
    - authority
    - reconsidered_at
    - decision
    - reason
  required_discovery_confirmation_fields:
    - schema_version
    - discovery_path
    - discovery_id
    - revision
    - reviewed_sha256
    - sha256
    - risk_class
    - authority
    - confirmed_at
    - decision
    - permitted_next_action
  required_micro_spec_review_fields:
    - schema_version
    - micro_spec_path
    - micro_spec_id
    - micro_spec_sha256
    - requirement_path
    - requirement_id
    - revision
    - requirement_sha256
    - risk
    - authority
    - decided_at
    - decision
    - reason
    - permitted_next_action
  discovery_confirmation_authorities_by_risk:
    low:
      - fixture-maintainer
  requirement_review_authorities_by_risk:
    low:
      - fixture-maintainer
  requirement_review_decision_authorities_by_risk:
    low:
      - fixture-maintainer
  requirement_reconsideration_authorities_by_risk:
    low:
      - fixture-maintainer
  requirement_approval_authorities_by_risk:
    low:
      - fixture-maintainer
  micro_spec_review_authorities_by_risk:
    low:
      - fixture-maintainer
  delivery_qc_authorities_by_risk:
    low:
      - fixture-maintainer
  control_plane_adoption:
    schema_version: 1
    requirements: []
